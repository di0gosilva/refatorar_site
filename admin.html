<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Administração</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src=./js/admin.js></script>
</head>
<body>
    <h1>Painel de Administração</h1>

    <section id="loginAdmin">
        <h2>Login de Administrador</h2>
        <input type="text" id="adminUser" placeholder="Usuário">
        <input type="password" id="adminPass" placeholder="Senha">
        <button id="btnAdminLogin">Entrar</button>
    </section>

    <section id="areaAdmin" style="display:none;">
        <h2>Cadastro de Produto</h2>
        <form id="formProduto">
            <input type="text" id="nomeProduto" placeholder="Nome" required>
            <input type="text" id="descProduto" placeholder="Descrição" required>
            <input type="text" id="codigoProduto" placeholder="Código" required>
            <input type="number" id="precoProduto" placeholder="Preço" required>
            <input type="text" id="linkProduto" placeholder="Link" required>
            <button type="submit">Cadastrar Produto</button>
        </form>

        <h2>Lista de Produtos</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos"></tbody>
        </table>
    </section>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
